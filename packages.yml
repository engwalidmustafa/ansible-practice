---
- name: Play to install packages
  hosts: all
  tasks:

    - name: Install packages on test prod and balancer
      ansible.builtin.dnf:
        name:
          - php
          - mariadb
        state: present
      when: ansible_hostname in groups['test'] or ansible_hostname in groups['prod'] or ansible_hostname in groups['balancer']

    - name: Install packages on dev
      ansible.builtin.dnf:
        name: '@RPM Development Tools'
        state: present
      when: ansible_hostname in groups['dev']

    - name: Update packages on dev
      ansible.builtin.dnf:
        name: "*"
        state: latest
      when: ansible_hostname in groups['dev']
