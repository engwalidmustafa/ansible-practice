---
- name: Create LVM
  hosts: all
  tasks:

    - name: Create lvm in block and rescue
      block:
      - name: Display message
        ansible.builtin.debug:
          msg: "Disk group is not available in {{anible_hostname}}"
        when: ansible_lvm.vgs is not defined

      - name: Create 1500 LV
        community.general.lvol:
          vg: research
          lv: data
          size: '1500'

      rescue:
      - name: Display message
        ansible.builtin.debug:
          msg: "Sufficient space is not available on {{ansible_hostname}}"

      - name: Create 800 LVM
        community.general.lvol:
          vg: research
          lv: data
          size: '800'

    - name: Create filesystem
      community.general.filesystem:
        fstype: ext4
        dev: /dev/research/data

