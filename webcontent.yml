---
- name: Play to create webcontent
  hosts: webservers
  tasks:

    - name: Create group
      ansible.builtin.group:
        name: devops
        state: present

    - name: Create directory
      ansible.builtin.file:
        path: /webdev
        state: directory
        owner: root
        group: devops
        mode: '02775'
        setype: httpd_sys_content_t

    - name: Create index content
      ansible.builtin.copy:
        content: "Development"
        dest: /webdev/index.html
        setype: httpd_sys_content_t

    - name: Create link
      ansible.builtin.file:
        src: /webdev/index.html
        dest: /var/www/html/webdev
        state: link
        force: true
        setype: httpd_sys_content_t

    - name: Install packages
      ansible.builtin.dnf:
        name: "{{item}}"
        state: present
      loop:
        - httpd
        - firewalld

    - name: Start service
      ansible.builtin.service:
        name: "{{item}}"
        state: started
        enabled: true
      loop:
        - httpd
        - firewalld

    - name: Allow http through firewall
      ansible.posix.firewalld:
        service: http
        state: enabled
        immediate: true
        permanent: true
