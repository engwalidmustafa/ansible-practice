---
- name: Play to create cron job
  hosts: test
  tasks:

    - name: Create cron job for natasha user
      ansible.builtin.cron:
        name: "example cron job"
        user: natasha
        state: present
        minute: "*/33"
        hour: "*"
        day: "*"
        month: "*"
        job: 'logger "hello hello hello"'
