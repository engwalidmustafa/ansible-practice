---
- name: Play to modify content
  hosts: all
  tasks:

    - name: Modify content on prod
      ansible.builtin.copy:
        content: '"Production"'
        dest: /etc/issue
      when: inventory_hostname in groups['prod']

    - name: Modify content on dev
      ansible.builtin.copy:
        content: '"Development"'
        dest: /etc/issue
      when: inventory_hostname in groups['dev']

    - name: Modify content on balancer
      ansible.builtin.copy:
        content: '"Balancer"'
        dest: /etc/issue
      when: inventory_hostname in groups['balancer']
