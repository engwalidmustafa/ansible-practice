---
- name: Play to modify content
  hosts: all
  tasks:

    - name: Nodify content on prod
      ansible.builtin.copy:
        content: '"Production"'
        dest: /etc/issue
      when: inventory_hostname in groups['prod']
    
    - name: Nodify content on dev
      ansible.builtin.copy:
        content: '"Development"'
        dest: /etc/issue
      when: inventory_hostname in groups['dev']
    
    - name: Nodify content on balancer
      ansible.builtin.copy:
        content: '"Balancer"'
        dest: /etc/issue
      when: inventory_hostname in groups['balancer']
