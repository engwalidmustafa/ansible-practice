---
# tasks file for roles/apache
- name: Install packages
  ansible.builtin.dnf:
    name: "{{item}}"
    state: present
  loop: "{{packages}}"

- name: Start services
  ansible.builtin.service:
    name: "{{item}}"
    state: started
    enabled: true
  loop: "{{services}}"

- name: Allow firewall
  ansible.posix.firewalld:
    service: "{{rule}}"
    state: enabled
    immediate: true
    permanent: true

- name: Use j2 template
  ansible.builtin.template:
    src: index.html.j2
    dest: /var/www/html/index.html
    setype: httpd_sys_content_t
