---
- name: Play to deploy roles
  hosts: all
  tasks:

    - name: Deploy role on balancer group
      ansible.builtin.include_role:
        name: balancer
      when: inventory_hostname in groups['balancer']

    - name: Deploy role on dev group
      ansible.builtin.include_role:
        name: phpinfo
      when: inventory_hostname in groups['dev']

