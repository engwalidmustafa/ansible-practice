---
- name: Play to depoly multiple roles
  hosts: all
  tasks:

    - name: Deploy role on balancer
      ansible.builtin.include_role:
        name: balancer
      when: ansible_hostname in groups['balancer']

    - name: Deploy role on dev
      ansible.builtin.include_role:
        name: phpinfo
      when: ansible_hostname in groups['dev']
