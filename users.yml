---
- name: Create users accordingly
  hosts: all
  vars_files:
    - secret.yml
    - users_list.txt
  tasks:

    - name: Create groups
      ansible.builtin.group:
        name: "{{item}}"
        state: present
      loop:
        - manager
        - devops

    - name: Create users on prod and test
      ansible.builtin.user:
        name: "{{item.name}}"
        comment: "{{item.job}}"
        group: manager
        password: "{{pwhash1|password_hash('sha512')}}"
      loop: "{{users}}"
      when: (inventory_hostname in groups['prod'] and item.job == 'developer') or (inventory_hostname in groups['test'] and item.job == 'developer')
      
    - name: Create users on dev
      ansible.builtin.user:
        name: "{{item.name}}"
        comment: "{{item.job}}"
        group: devops
        password: "{{pwhash2|password_hash('sha512')}}"
      loop: "{{users}}"
      when: inventory_hostname in groups['dev'] and item.job == 'devops'
