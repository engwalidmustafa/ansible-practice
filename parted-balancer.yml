---
- name: Play to create partition
  hosts: balancer
  tasks:

    - name: Start block
      block:
      - name: Display message
        debug:
          msg: "Disk doesnt exist"
        when: ansible_facts.sda7 is not defined

      - name: Create partition 1gb
        parted:
          device: /dev/sda
          number: 7
          state: present
          part_end: 1GiB

      rescue:
      - name: Display message
        debug:
          msg: "couldnt create partition of that size"

      - name: Create partition 500mb
        parted:
          device: /dev/sda
          number: 7
          state: present
          part_end: 500MiB

      always:
      - name: Create file system
        filesystem:
          device: /dev/sda7
          fstype: ext4
        when: ansible_facts.devices.sda is defined

      - name: Mount filesystem
        mount:
          src: /dev/sda7
          path: /mnt/walid
          state: mounted
          fstype: ext4
        when: inventory_hostname in groups['balancer']
