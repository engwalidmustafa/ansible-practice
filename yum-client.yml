---
- name: Play to create multiple repo
  hosts: all
  tasks:

    - name: Create BaseOS repo
      ansible.builtin.yum_repository:
        name: RHEL10_BASEOS
        description: BaseOS Repo for RHEL 10
        baseurl: http://content.example.com/rhel10.0/x86_64/dvd/BaseOS
        enabled: false
        gpgcheck: false

    - name: Create Appstream repo
      ansible.builtin.yum_repository:
        name: RHEL10_APPSTREAM
        description: AppStream Repo for RHEL 10
        baseurl: http://content.example.com/rhel10.0/x86_64/dvd/AppStream
        enabled: false
        gpgcheck: false
