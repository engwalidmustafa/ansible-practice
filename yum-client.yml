---
- name: Play to create multiple Repo
  hosts: all
  tasks:

    - name: Create BaseOS Repo
      ansible.builtin.yum_repository:
        name: RHEL10_BASEOS
        description: BaseOS Repo for RHEL 10
        baseurl: http://-------------
        enabled: false
        gpgcheck: false
    
    - name: Create AppStream Repo
      ansible.builtin.yum_repository:
        name: RHEL10_APPSTREAM
        description: AppStream Repo for RHEL 10
        baseurl: http://-------------
        enabled: false
        gpgcheck: false
