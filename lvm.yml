---
- name: Play to create multiple lvm
  hosts: all
  ignore_errors: true
  tasks:

   - block:
     - block:
        - name: Display message
          ansible.builtin.debug:
            msg: "Disk group is not available on {{ansible_hostname}}"
          when: ansible_lvm.vgs.research is not defined
        
        - name: Create 1500mb lvm
          community.general.lvol:
            vg: research
            lv: data
            size: '1500'
          when: ansible_lvm.vgs.research.size_g > '1.5'

     - block:
        - name: Display message
          ansible.builtin.debug:
           msg: "Sufficient splace is not available on {{ansible_hostname}}"
      
        - name: Create 800mb lvm
          community.general.lvol:
            vg: research
            lv: data
            size: '800'
          when: ansible_lvm.vgs.research.size_g < '1.5'

     - block:
        - name: Create file system
          community.general.filesystem:
            fstype: ext4
            dev: /dev/research/data
          when: ansible_lvm.vgs.research is defined

