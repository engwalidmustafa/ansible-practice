---
- name: Play to collect host info
  hosts: all
  vars:
    hostname: "{{ansible_facts['hostname']}}"
    mem_size: "{{ansible_facts['memtotal_mb']}}"
    bios_version: "{{ansible_facts['bios_version']}}"
    sda_size: "{{ansible_facts['devices']['sda']['size']|default('NONE')}}"
    sdb_size: "{{ansible_facts['devices']['sdb']['size']|default('NONE')}}"
  tasks:

   # - name: Download the txt file to managed node
    #  ansible.builtin.get_url:
     #   url: ------------
      #  dest: /root/hostinfo.txt

    - name: Copy txt to all managed node
      ansible.builtin.copy:
        src: hostinfo.txt
        dest: /root/hostinfo.txt

    - name: Collect hostname info
      ansible.builtin.lineinfile:
        path: /root/hostinfo.txt
        regexp: '^HOST'
        line: 'HOST={{hostname}}'
    
    - name: Collect memory info
      ansible.builtin.lineinfile:
        path: /root/hostinfo.txt
        regexp: '^MEM'
        line: 'MEM={{mem_size}}'
    
    - name: Collect bios version info
      ansible.builtin.lineinfile:
        path: /root/hostinfo.txt
        regexp: '^BIOS'
        line: 'BIOS={{bios_version}}'
    
    - name: Collect sda info
      ansible.builtin.lineinfile:
        path: /root/hostinfo.txt
        regexp: '^SDA'
        line: 'SDA={{sda_size}}'
    
    - name: Collect SDB info
      ansible.builtin.lineinfile:
        path: /root/hostinfo.txt
        regexp: '^SDB'
        line: 'SDB={{sdb_size}}'
