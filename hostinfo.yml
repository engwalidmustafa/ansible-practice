---
- name: Play to collect hostinfo
  hosts: all
  vars:
    hostname: "{{ansible_facts['hostname']}}"
    mem_size: "{{ansible_facts['memtotal_mb']}}"
    bios_version: "{{ansible_facts['bios_version']}}"
    sda_size: "{{ansible_facts['devices']['sda']['size']|default('NONE')}}"
    sdb_size: "{{ansible_facts['devices']['sdb']['size']|default('NONE')}}"
  tasks:

   # - name: Download txt file to root
    #  ansible.builtin.get_url:
     #   url: http://-------------
      #  dest: /root/hostinfo.txt
    - name: Copy txt to root
      ansible.builtin.copy:
        src : hostinfo.txt
        dest: /root/hostinfo.txt

    - name: Read hostname info
      ansible.builtin.lineinfile:
        path: /root/hostinfo.txt
        regexp: '^HOST'
        line: 'HOST={{hostname}}'

    - name: Read hostname info
      ansible.builtin.lineinfile:
        path: /root/hostinfo.txt
        regexp: '^HOST'
        line: 'HOST={{hostname}}'

    - name: Read memory info
      ansible.builtin.lineinfile:
        path: /root/hostinfo.txt
        regexp: '^MEM'
        line: 'HOST={{mem_size}}'

    - name: Read bios version info
      ansible.builtin.lineinfile:
        path: /root/hostinfo.txt
        regexp: '^BIOS'
        line: 'BIOS={{bios_version}}'

    - name: Read sda size info
      ansible.builtin.lineinfile:
        path: /root/hostinfo.txt
        regexp: '^SDA'
        line: 'SDA={{sda_size}}'

    - name: Read sdb size info
      ansible.builtin.lineinfile:
        path: /root/hostinfo.txt
        regexp: '^SDB'
        line: 'SDB={{sdb_size}}'
