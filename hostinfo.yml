---
- name: Play to replace hostinfo
  hosts: all
  vars:
    hostname: "{{ansible_facts['hostname']}}"
    mem_size: "{{ansible_facts['memtotal_mb']}}"
    bios_version: "{{ansible_facts['bios_version']}}"
    sda_size: "{{ansible_facts['devices']['sda']['size']|default('NONE')}}"
    sdb_size: "{{ansible_facts['devices']['sdb']['size']|default('NONE')}}"
  tasks:

    #- name: Download hostinfo.txt
     # ansible.builtin.get_url:
      #  url: http://------------------------
       # dest: /root/hostinfo.txt
       #
    - name: Download hostinfo.txt
      ansible.builtin.copy:
        src: hostinfo.txt
        dest: /root/hostinfo.txt

    - name: Replace the hostinfo name
      ansible.builtin.lineinfile:
        path: /root/hostinfo.txt
        regexp: '^HOST'
        line: 'HOST={{hostname}}'

    - name: Replace the memory size
      ansible.builtin.lineinfile:
        path: /root/hostinfo.txt
        regexp: '^MEM'
        line: 'MEM={{mem_size}}'

    - name: Replace the bios version
      ansible.builtin.lineinfile:
        path: /root/hostinfo.txt
        regexp: '^BIOS'
        line: 'BIOS={{bios_version}}'

    - name: Replace the sda size
      ansible.builtin.lineinfile:
        path: /root/hostinfo.txt
        regexp: '^SDA'
        line: 'SDA={{sda_size}}'

    - name: Replace the sdb
      ansible.builtin.lineinfile:
        path: /root/hostinfo.txt
        regexp: '^SDB'
        line: 'SDB={{sdb_size}}'

