---
- name: Play to collect host info
  hosts: all
  vars:
    hostname: "{{ansible_facts['hostname']}}"
    mem_size: "{{ansible_facts['memtotal_mb']}}"
    bios_version: "{{ansible_facts['bios_version']}}"
    sda_size: "{{ansible_facts['devices']['sda']['size']|default('NONE')}}"
    sdb_size: "{{ansible_facts['devices']['sdb']['size']|default('NONE')}}"
  tasks:

    - name: Copy txt to all hosts
      #ansible.builtin.get_url
      #url: http://-----------
      #dest: /root/hostinfo.txt
      ansible.builtin.copy:
        src: hostinfo.txt
        dest: /root/hostinfo.txt

    - name: Collect host name
      ansible.builtin.lineinfile:
        path: /root/hostinfo.txt
        regexp: '^HOST'
        line: 'HOST={{hostname}}'

    - name: Collect memory size
      ansible.builtin.lineinfile:
        path: /root/hostinfo.txt
        regexp: '^MEM'
        line: 'MEM={{mem_size}}'

    - name: Collect bios version
      ansible.builtin.lineinfile:
        path: /root/hostinfo.txt
        regexp: '^BIOS'
        line: 'BIOS={{bios_version}}'

    - name: Collect SDA
      ansible.builtin.lineinfile:
        path: /root/hostinfo.txt
        regexp: '^SDA'
        line: 'SDA={{sda_size}}'

    - name: Collect SDB
      ansible.builtin.lineinfile:
        path: /root/hostinfo.txt
        regexp: '^SDB'
        line: 'SDB={{sdb_size}}'
